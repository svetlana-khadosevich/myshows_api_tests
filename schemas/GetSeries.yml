type: array
items:
    type: object
    additionalProperties: false
    properties:
        id:
          type: integer
        name:
          type: string
        photo:
          oneOf:
            - type: string
            - type: "null"
        rating:
          oneOf:
            - type: integer
            - type: "null"
        status:
          type: string
          enum:
            - 'watching'
            - 'watched'
            - 'will_watch'
        review:
          oneOf:
            - type: string
            - type: "null"
required:
  - id
  - name
  - status